<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <style>
    .bar   { fill: #017AEB; }
    .bar-2 { fill: #217C78; }
    .label { font-family: 'Poppins', sans-serif; font-size: 16px; fill: #1A1A1A; }
    .title { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; fill: #1A1A1A; }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="3" dy="4" result="off" />
      <feComponentTransfer><feFuncA type="linear" slope="0.4" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <text class="title" x="20" y="34">Resultados por trimestre</text>

  <g filter="url(#shadow)">
    <rect class="bar"   x="40"  y="120" width="60" height="90"  rx="4" />
    <rect class="bar-2" x="130" y="80"  width="60" height="130" rx="4" />
    <rect class="bar"   x="220" y="60"  width="60" height="150" rx="4" />
    <rect class="bar-2" x="310" y="100" width="60" height="110" rx="4" />
  </g>

  <text class="label" x="52"  y="228">Q1</text>
  <text class="label" x="142" y="228">Q2</text>
  <text class="label" x="232" y="228">Q3</text>
  <text class="label" x="322" y="228">Q4</text>
</svg>
